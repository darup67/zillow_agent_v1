<title>Zillow Digest</title><style>

</style></head><body><main>
<header><div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#07140f" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12 12 4l9 8"/><path d="M6 10v10h12V10"/></svg></div><div><h1>Zillow Digest</h1><div class="sub" id="sub">connecting…</div></div>
<span class="pill"><span class="dot" id="dot"></span><span id="livet">digest ok</span></span>
<span class="pill" title="next digest"><svg class="ring" viewBox="0 0 24 24"><circle class="bg" cx="12" cy="12" r="9"/><circle class="fg" id="ringfg" cx="12" cy="12" r="9" stroke-dasharray="56.5" stroke-dashoffset="56.5"/></svg><span id="cd">–</span></span></header>
<div id="alert"></div>
<section class="hero" id="hero"><div class="card h a skel"></div><div class="card h k skel"></div></section>
<nav class="tabs" id="tabs"><button class="tab on" data-p="list">Listings</button><button class="tab" data-p="str">STR picks</button><button class="tab" data-p="trend">Trends</button><button class="tab" data-p="zip">ZIPs &amp; markets</button><button class="tab" data-p="run">Delivery</button></nav>
<div class="pane on" id="p_list"><div class="chips" id="c_search"></div><div class="chips" id="c_sig"></div><div class="chips" id="c_mkt"></div>
<div class="tools"><input id="q" type="search" placeholder="Search address or ZIP"><select id="sort"><option value="def">Best first</option><option value="price_a">Price: low to high</option><option value="price_d">Price: high to low</option><option value="pct">Biggest % change</option><option value="dom_d">Days on market: most</option><option value="dom_a">Days on market: fewest</option></select></div>
<div class="grid" id="grid"></div><div class="note" id="more"></div></div>
<div class="pane" id="p_str"><div class="chips" id="c_strt"></div><div class="grid" id="g_str"></div><div class="note" id="n_str"></div></div>
<div class="pane" id="p_trend"><div class="two"><div class="card"><div class="sec">New listings per day</div><div class="bd"><div class="bars" id="b_new"></div><div class="legend"><span><i style="background:var(--em)"></i>houses</span><span><i style="background:var(--sky)"></i>condos</span></div></div><div class="sec">Price cuts per day</div><div class="bd"><div class="bars" id="b_cut"></div></div></div>

<div class="pane" id="p_zip"><div class="two"><div class="card"><div class="sec">Inventory by ZIP · primary buy box</div><div class="bd" id="zips"></div></div><div class="card"><div class="sec">Markets</div><div class="bd" id="mk"></div></div></div></div>
<div class="pane" id="p_run"><div class="card"><div class="sec">Email delivery</div><div class="bd" id="runbox"></div></div></div>
</main><script>
let D=null,S={search:"primary",sig:"new",mkt:"All",q:"",sort:"def",tab:"list"},prev={};const $=id=>document.getElementById(id),RM=matchMedia("(prefers-reduced-motion:reduce)").matches;
const money=n=>n==null?"–":"$"+Math.round(n).toLocaleString(),pct=x=>x==null?"":(x>=0?"+":"")+x.toFixed(1)+"%",esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const SIGS=[["new","New"],["priceCuts","Price cuts"],["underMedian","Value deals"],["motivated","Motivated sellers"],["priceIncreases","Price increases"],["backOnMarket","Back on market"]],SNAME={primary:"Houses",["condos-small"]:"Condos",rentals:"Rentals"};
try{const t=JSON.parse(localStorage.getItem("zdstate")||"{}");S={...S,...t}}catch(e){}
const save=()=>{try{localStorage.setItem("zdstate",JSON.stringify({tab:S.tab,search:S.search,sig:S.sig,mkt:S.mkt}))}catch(e){}};
function setTab(t){S.tab=t;save();document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.p===t));document.querySelectorAll(".pane").forEach(p=>p.classList.toggle("on",p.id==="p_"+t))}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>setTab(b.dataset.p));$("q").oninput=e=>{S.q=e.target.value.toLowerCase();renderList()};$("sort").onchange=e=>{S.sort=e.target.value;renderList()};
function cu(el,to){const k=el.dataset.cu,from=prev[k]??0;prev[k]=to;if(RM||from===to){el.textContent=Math.round(to).toLocaleString();return}const t0=performance.now();requestAnimationFrame(function s(t){const p=Math.min(1,(t-t0)/900),e=1-Math.pow(1-p,3);el.textContent=Math.round(from+(to-from)*e).toLocaleString();if(p<1)requestAnimationFrame(s)})}
const dg=()=>D&&D.digest,srch=id=>dg()&&dg().searches.find(s=>s.id===id);
function hero(){const g=dg(),pl=D.pulse||{};if(!g){$("hero").innerHTML='<div class="card h a"><span class="tag">No digest yet</span><div class="empty">The next 7:30 AM run will fill this in.</div></div>';return}
const sum=k=>g.searches.reduce((a,s)=>a+((s.counts||{})[k]||0),0),when=new Date(g.t);
const chip=(l,k,sig,search)=>`<div data-go="${sig}|${search||""}"><small>${l}</small><b class="num" data-cu="${k}">–</b></div>`;
const html=`<div class="card h a"><span class="tag">Latest digest</span> <span class="mut" style="font-size:12px">${D.day} · ${when.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"})}${g.reconstructed?" · rebuilt from the saved state":""}</span>
<div class="big"><span class="num" data-cu="tot">–</span> <span style="font-size:17px;font-weight:600;color:var(--ink2)">changes in your buy boxes</span></div>
<div class="delta">${g.searches.map(s=>`${SNAME[s.id]||s.name} <b class="num">${(s.counts.new||0)+(s.counts.priceCuts||0)+(s.counts.priceIncreases||0)}</b>`).join(" · ")}</div>
<div class="mini">${chip("New listings","new","new")}${chip("Price cuts","cuts","priceCuts")}${chip("Value deals","val","underMedian")}${chip("STR rent-ready","str","str")}</div></div>
<div class="card h k"><span class="tag s">Market pulse</span> <span class="mut" style="font-size:12px">houses 2005+ · all ${D.zips&&D.zips.length?"tracked ZIPs":""}</span>
<div class="big"><span class="num" data-cu="trk">–</span> <span style="font-size:17px;font-weight:600;color:var(--ink2)">listings tracked</span></div><div class="delta">${pl.stale90?`<b class="num amb">${pl.stale90.toLocaleString()}</b> sitting 90+ days (${Math.round(100*pl.stale90/pl.tracked)}%)`:""}</div>
<div class="mini"><div><small>Median price</small><b class="num">${money(pl.median_price)}</b></div><div><small>Median days listed</small><b class="num">${pl.median_dom??"–"}</b></div><div><small>Delivery</small><b class="${D.run.problem?"dn":"up"}" style="font-size:16px">${D.run.problem?"problem":"ok"}</b></div><div><small>Days on file</small><b class="num">${(D.history||[]).length}</b></div></div></div>`;
if(hero.last!==html){$("hero").innerHTML=html;hero.last=html;document.querySelectorAll("[data-go]").forEach(e=>e.onclick=()=>{const[s,se]=e.dataset.go.split("|");if(s==="str"){setTab("str");return}S.sig=s;S.search="primary";setTab("list");chips();renderList()})}
const v={new:sum("new"),cuts:sum("priceCuts"),val:sum("value")||0,str:(g.str||[]).reduce((a,s)=>a+s.total,0),tot:sum("new")+sum("priceCuts")+sum("priceIncreases"),trk:pl.tracked||0};
if(!g.str||!g.str.length)v.str=((D.history[D.history.length-1]||{}).str||[]).reduce((a,s)=>a+s.total,0);
if(!sum("value")){v.val=(((D.history[D.history.length-1]||{}).searches)||[]).reduce((a,s)=>a+(s.value||0),0)}
document.querySelectorAll("[data-cu]").forEach(el=>cu(el,v[el.dataset.cu]||0))}
function chips(){const g=dg();if(!g)return;$("c_search").innerHTML=g.searches.map(s=>`<button class="chip s ${S.search===s.id?"on":""}" data-s="${s.id}">${SNAME[s.id]||s.name}<i>${s.tracked.toLocaleString()}</i></button>`).join("");
const cur=srch(S.search);$("c_sig").innerHTML=SIGS.map(([k,l])=>`<button class="chip ${S.sig===k?"on":""}" data-g="${k}">${l}<i>${cur?((cur.counts||{})[k==="underMedian"?"value":k]??(cur[k]||[]).length):0}</i></button>`).join("");

document.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{S.search=b.dataset.s;save();chips();renderList()});document.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{S.sig=b.dataset.g;save();chips();renderList()});document.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{S.mkt=b.dataset.m;save();chips();renderList()})}
function card(l,i,sig){const cut=l.changePct!=null,badges=[];
if(l.market)badges.push(`<span class="b">${esc(l.market)}</span>`);badges.push(`<span class="b">${esc(l.zip||"")}</span>`);
if(l.beds!=null)badges.push(`<span class="b">${l.beds} bd${l.baths!=null?" · "+l.baths+" ba":""}${l.sqft?" · "+Number(l.sqft).toLocaleString()+" sqft":""}</span>`);
if(l.yearBuilt)badges.push(`<span class="b">built ${l.yearBuilt}</span>`);if(l.dom!=null)badges.push(`<span class="b ${l.dom>=90?"y":""}">${l.dom}d listed</span>`);
if(l.ppsf)badges.push(`<span class="b">$${l.ppsf}/sqft</span>`);if(l.discountPct!=null&&l.discountPct>=1)badges.push(`<span class="b g">${l.discountPct.toFixed(0)}% under ZIP $/sqft</span>`);
if(cut)badges.push(`<span class="b ${l.changePct<0?"g":"r"}">${pct(l.changePct)}</span>`);if(l.prevStatus)badges.push(`<span class="b y">was ${esc(l.prevStatus)}</span>`);if(l.status&&l.status!=="Active")badges.push(`<span class="b y">${esc(l.status)}</span>`);if(l.openHouse)badges.push(`<span class="b g">open house</span>`);
return`<a class="card li" href="${esc(l.url||"#")}" target="_blank" rel="noopener noreferrer" style="animation-delay:${Math.min(i,14)*35}ms"><div class="t"><div><div class="ad">${esc(l.address||"")}</div><div class="mut" style="font-size:12.5px">${esc(l.city||"")}</div></div><div><div class="pr">${money(l.price)}</div>${cut?`<div class="was num" style="text-align:right">${money(l.prevPrice)}</div>`:""}</div></div><div class="mt">${badges.join("")}</div></a>`}
function renderList(){const s=srch(S.search);if(!s){$("grid").innerHTML='<div class="empty">no data</div>';return}let a=(s[S.sig]||[]).slice();
if(S.mkt!=="All")a=a.filter(x=>x.market===S.mkt);if(S.q)a=a.filter(x=>((x.address||"")+" "+(x.zip||"")+" "+(x.city||"")).toLowerCase().includes(S.q));
const so={price_a:(x,y)=>x.price-y.price,price_d:(x,y)=>y.price-x.price,pct:(x,y)=>Math.abs(y.changePct||0)-Math.abs(x.changePct||0),dom_d:(x,y)=>(y.dom||0)-(x.dom||0),dom_a:(x,y)=>(x.dom??1e9)-(y.dom??1e9)}[S.sort];if(so)a.sort(so);
const total=((s.counts||{})[S.sig==="underMedian"?"value":S.sig]??a.length),html=a.slice(0,60).map((l,i)=>card(l,i,S.sig)).join("");
const g=$("grid");if(g.dataset.h!==html){g.innerHTML=html||`<div class="card empty" style="grid-column:1/-1">${dg().reconstructed&&(S.sig==="underMedian"||S.sig==="motivated"||S.sig==="backOnMarket")?"Today's digest was rebuilt from the saved state, so this list fills in from tomorrow's 7:30 AM run.":"Nothing in this view."}</div>`;g.dataset.h=html}
$("more").textContent=a.length>60?`Showing 60 of ${a.length}.`:(total>a.length&&!S.q&&S.mkt==="All"?`The digest keeps the top ${a.length} of ${total}.`:"")}
function renderStr(){const g=dg(),st=g&&g.str&&g.str[0];const tabs=[["rows","Rent-ready"],["multiRows","Multi-unit"],["sharedRows","Shared living"],["rehabRows","Rehab"]];if(!st){$("g_str").innerHTML=`<div class="card empty" style="grid-column:1/-1">STR picks arrive with the next 7:30 AM run (today's digest was rebuilt from saved state).</div>`;$("c_strt").innerHTML="";$("n_str").textContent="";return}
S.strt=S.strt||"rows";$("c_strt").innerHTML=tabs.map(([k,l])=>`<button class="chip ${S.strt===k?"on":""}" data-t="${k}">${l}<i>${({rows:st.total,multiRows:st.multiTotal,sharedRows:st.sharedTotal,rehabRows:st.rehabTotal})[k]}</i></button>`).join("");
document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{S.strt=b.dataset.t;renderStr()});
$("g_str").innerHTML=(st[S.strt]||[]).map((l,i)=>{const c=card(l,i);return c.replace('</div></a>',`${l.estRent?`<span class="b g">est rent ${money(l.estRent)}/mo</span><span class="b">${l.ltrRatio?l.ltrRatio.toFixed(2)+"% rent/price":""}</span>`:""}${(l.flags||[]).slice(0,2).map(f=>`<span class="b y">${esc(f)}</span>`).join("")}</div></a>`)}).join("")||'<div class="card empty" style="grid-column:1/-1">none in this group</div>';
$("n_str").textContent="Short-term-rental gross is an assumption (long-term rent × uplift × occupancy), not live nightly-rate data. Same screen as the email."}
function bars(id,fn,cls2){const h=D.history||[],vals=h.map(fn),mx=Math.max(1,...vals.map(v=>v[0]+(v[1]||0)));$(id).innerHTML=h.map((r,i)=>{const[a,b]=vals[i];return`<div title="${r.day}: ${a}${b!=null?" houses, "+b+" condos":""}" style="height:${100*(a+(b||0))/mx}%;animation-delay:${i*20}ms"></div>`}).join("")}
function trends(){bars("b_new",r=>[((r.searches||[]).find(s=>s.id==="primary")||{}).new||0,((r.searches||[]).find(s=>s.id==="condos-small")||{}).new||0]);bars("b_cut",r=>[((r.searches||[]).find(s=>s.id==="primary")||{}).priceCuts||0,0]);
$("hist").innerHTML=`<table class="tbl"><tr><th>day</th><th class="r">tracked</th><th class="r">new</th><th class="r">cuts</th><th class="r">STR</th></tr>`+[...(D.history||[])].reverse().map(r=>{const p=(r.searches||[]).find(s=>s.id==="primary")||{},c=(r.searches||[]).find(s=>s.id==="condos-small")||{};return`<tr><td>${r.day.slice(5)}</td><td class="r num">${(p.tracked||0).toLocaleString()}</td><td class="r num">${(p.new||0)+(c.new||0)}</td><td class="r num">${(p.priceCuts||0)+(c.priceCuts||0)}</td><td class="r num">${((r.str||[])[0]||{}).total??"–"}</td></tr>`}).join("")+"</table>"}
function zips(){const z=D.zips||[],mx=Math.max(1,...z.map(r=>r.tracked));const h=z.slice(0,24).map(r=>`<div class="zr"><span><b>${r.zip}</b></span><div class="zbar"><i data-w="${100*r.tracked/mx}"></i></div><span class="num" style="text-align:right">${r.tracked} <span class="mut" style="font-size:11px">${r.median_price?"$"+Math.round(r.median_price/1000)+"k":""}</span></span></div>`).join("");
const el=$("zips");if(el.dataset.h!==h){el.innerHTML=h;el.dataset.h=h;el.querySelectorAll(".zbar i").forEach(b=>{b.style.width="0";requestAnimationFrame(()=>requestAnimationFrame(()=>b.style.width=b.dataset.w+"%"))})}
const by={};(D.zips||[]).forEach(r=>{const m=by[r.market||"Other"]=by[r.market||"Other"]||{n:0,s:0,p:[]};m.n+=r.tracked;m.s+=r.stale;if(r.median_price)m.p.push(r.median_price)});
$("mk").innerHTML=`<table class="tbl"><tr><th>market</th><th class="r">tracked</th><th class="r">90d+</th></tr>`+Object.entries(by).sort((a,b)=>b[1].n-a[1].n).map(([k,m])=>`<tr><td>${k}</td><td class="r num">${m.n.toLocaleString()}</td><td class="r num amb">${Math.round(100*m.s/m.n)}%</td></tr>`).join("")+"</table><div class='note'>Top 40 ZIPs by inventory; houses 2005+ buy box.</div>"}
function run(){const r=D.run,f=t=>t?new Date(t).toLocaleString("en-US",{weekday:"short",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}):"–";
$("runbox").innerHTML=`<table class="tbl"><tr><td>Last scan</td><td class="r">${f(r.last_run)}</td></tr><tr><td>Last email</td><td class="r">${f(r.email_sent)}</td></tr><tr><td>Subject</td><td class="r" style="max-width:420px">${esc(r.subject||"–")}</td></tr><tr><td>Schedule</td><td class="r">weekdays and weekends · 7:30 AM ET</td></tr><tr><td>Status</td><td class="r ${r.problem?"dn":"up"}">${r.problem?esc(r.problem):"ok"}</td></tr></table><div class="note">The email keeps going out exactly as before. This page only reads what the agent saved, so it never changes the digest or its change tracking.</div>`;
$("alert").innerHTML=r.problem?`<div class="alert"><b>Heads up:</b> ${esc(r.problem)}</div>`:"";$("dot").className="dot"+(r.problem?" bad":"");$("livet").textContent=r.problem?"problem":"digest ok"}
function draw(){if(!D)return;$("sub").textContent=`Daily Atlanta-area listings digest · ${D.day||"no digest yet"} · read-only`;hero();chips();renderList();renderStr();trends();zips();run()}
function ringTick(){const now=new Date(),n=new Date(now);n.setHours(7,30,0,0);if(n<=now)n.setDate(n.getDate()+1);const left=(n-now)/1000,tot=86400;$("cd").textContent=left>3600?`next digest in ${Math.floor(left/3600)}h ${Math.floor(left%3600/60)}m`:`next digest in ${Math.floor(left/60)}m`;$("ringfg").style.strokeDashoffset=56.5*Math.max(0,Math.min(1,left/tot))}
async function tick(){try{D=await (await fetch("/api")).json();draw()}catch(e){$("sub").textContent="cannot read the agent's files"}}
setTab(S.tab);tick();setInterval(tick,60000);setInterval(ringTick,1000);ringTick();
</script></body></html>
