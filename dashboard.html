const so={price_a:(x,y)=>x.price-y.price,price_d:(x,y)=>y.price-x.price,pct:(x,y)=>Math.abs(y.changePct||0)-Math.abs(x.changePct||0),dom_d:(x,y)=>(y.dom||0)-(x.dom||0),dom_a:(x,y)=>(x.dom??1e9)-(y.dom??1e9)}[S.sort];if(so)a.sort(so);
$("count").textContent=`${label} · ${a.length} listing${a.length===1?"":"s"}${S.mkt!=="All"?" in "+S.mkt:""}`;
const html=a.slice(0,S.lim).map((l,i)=>rowHTML(l,i,S.sig,view)).join("")||`<div class="empty">${g.reconstructed&&["underMedian","motivated","backOnMarket"].includes(S.sig)&&view==="feed"?"Not in the rebuilt digest — this list fills in from the next 7:30 AM run.":"Nothing matches these filters."}</div>`;
if(box.dataset.h!==html){box.innerHTML=html;box.dataset.h=html}
const mb=$("morebtn");if(a.length>S.lim){mb.style.display="block";mb.textContent=`Show ${Math.min(30,a.length-S.lim)} more of ${a.length-S.lim} remaining`;mb.onclick=()=>{S.lim+=30;rows()}}else mb.style.display="none"}
function side(){const g=dg(),pl=D.pulse||{};
$("pulse").innerHTML=`<div><small>Tracked</small><b class="num">${(pl.tracked||0).toLocaleString()}</b></div><div><small>Median price</small><b class="num">${money(pl.median_price)}</b></div><div><small>Median days listed</small><b class="num">${pl.median_dom??"–"}</b></div><div><small>Listed 90+ days</small><b class="num amb">${pl.tracked?Math.round(100*pl.stale90/pl.tracked)+"%":"–"}</b></div>`;
const by={};if(g){const s=srch(S.search);["new","priceCuts"].forEach(k=>((s&&s[k])||[]).forEach(l=>{const m=l.market||"Other";by[m]=(by[m]||0)+1}))}
const ents=Object.entries(by).sort((a,b)=>b[1]-a[1]),mx=Math.max(1,...ents.map(e=>e[1]));
const h=ents.map(([m,n])=>`<div class="mb ${S.mkt===m?"on":""}" data-m="${m}"><span class="n">${m}</span><div class="track"><i data-w="${100*n/mx}"></i></div><b class="num" style="text-align:right">${n}</b></div>`).join("")||'<div class="mut" style="font-size:12.5px">nothing yet</div>';
const el=$("bymkt");if(el.dataset.h!==h){el.innerHTML=h;el.dataset.h=h;el.querySelectorAll(".track i").forEach(b=>{b.style.width="0";requestAnimationFrame(()=>requestAnimationFrame(()=>b.style.width=b.dataset.w+"%"))});el.querySelectorAll(".mb").forEach(x=>x.onclick=()=>{S.mkt=S.mkt===x.dataset.m?"All":x.dataset.m;S.lim=30;save();controls();side();rows()})}else el.querySelectorAll(".mb").forEach(x=>x.classList.toggle("on",S.mkt===x.dataset.m));
const H=(D.history||[]).slice(-30),v=H.map(r=>hp(r,"primary","new")+hp(r,"condos-small","new")),m2=Math.max(1,...v);
$("hist").innerHTML=H.map((r,i)=>`<div data-t="${r.day.slice(5)} · ${v[i]} new" style="height:${Math.max(3,100*v[i]/m2)}%;animation-delay:${i*14}ms"></div>`).join("");
document.querySelectorAll("#hist div").forEach(d=>{d.onmousemove=e=>showTip(e,d.dataset.t);d.onmouseleave=hideTip});$("h1").textContent=H[0]?H[0].day.slice(5):"";$("h2").textContent=H.length?H[H.length-1].day.slice(5)+" · latest":"";
const z=(D.zips||[]).slice(0,8),zm=Math.max(1,...z.map(r=>r.tracked));$("zips").innerHTML=z.map(r=>`<div class="mb" style="cursor:default"><span class="n">${r.zip} <span class="mut">${(r.market||"").split(" ")[0]}</span></span><div class="track"><i data-w="${100*r.tracked/zm}"></i></div><b class="num" style="text-align:right;font-size:12px">${r.tracked}</b></div>`).join("");
document.querySelectorAll("#zips .track i").forEach(b=>{b.style.width="0";requestAnimationFrame(()=>requestAnimationFrame(()=>b.style.width=b.dataset.w+"%"))});
const r=D.run,f=t=>t?new Date(t).toLocaleString("en-US",{weekday:"short",hour:"numeric",minute:"2-digit"}):"–";
$("deliv").innerHTML=`<span>Last scan</span><span>${f(r.last_run)}</span><span>Last email</span><span>${f(r.email_sent)}</span><span>Status</span><span class="${r.problem?"dn":"up"}">${r.problem?"problem":"delivered"}</span><span>Schedule</span><span>daily 7:30 AM ET</span>`;
$("alert").innerHTML=r.problem?`<div class="alert"><b>Heads up:</b> ${esc(r.problem)}</div>`:"";$("dot").className="dot"+(r.problem?" bad":"");$("st").textContent=r.problem?"problem":"digest ok"}
function days(){const d=$("day");if((D.days||[]).length>1){d.style.display="";d.innerHTML=D.days.slice().reverse().map(x=>`<option ${x===D.day?"selected":""}>${x}</option>`).join("")}else d.style.display="none"}
function draw(){if(!D)return;controls();kpis();rows();side();days()}
function ringTick(){const now=new Date(),n=new Date(now);n.setHours(7,30,0,0);if(n<=now)n.setDate(n.getDate()+1);const left=(n-now)/1000;$("nx").textContent=left>3600?`· next in ${Math.floor(left/3600)}h ${Math.floor(left%3600/60)}m`:`· next in ${Math.floor(left/60)}m`}
async function tick(){try{D=await (await fetch("/api"+(DAY?"?day="+DAY:""))).json();draw()}catch(e){$("sub").textContent="cannot read the agent's files"}}
tick();setInterval(tick,60000);setInterval(ringTick,30000);ringTick();
</script></body></html>
